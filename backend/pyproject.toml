[project]
name = "citizen-journalism-platform"
version = "1.0.0"
description = "A secure, scalable citizen journalism platform where readers vote on topics and writers create content"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["journalism", "fastapi", "citizen-journalism", "content-platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    # FastAPI and ASGI server
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",

    # Database
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "psycopg2-binary==2.9.9",
    "asyncpg==0.29.0",

    # Redis and Caching
    "redis==5.0.1",
    "hiredis==2.2.3",

    # Authentication and Security
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2]==1.7.4",
    "python-dateutil==2.8.2",
    "pyotp==2.9.0",
    "qrcode==7.4.2",

    # Pydantic for validation
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "email-validator==2.1.0",

    # Celery for async tasks
    "celery==5.3.4",
    "flower==2.0.1",

    # Elasticsearch
    "elasticsearch==8.11.0",

    # Payment processing
    "stripe==7.7.0",

    # AI Integration
    "openai==1.3.7",
    "anthropic==0.7.7",

    # File handling and storage
    "boto3==1.34.5",
    "pillow==10.1.0",
    "python-magic==0.4.27",

    # Email
    "aiosmtplib==3.0.1",
    "jinja2==3.1.2",

    # HTTP client
    "httpx==0.25.2",
    "aiohttp==3.9.1",

    # Data validation and serialization
    "orjson==3.9.10",

    # Security and cryptography
    "cryptography==41.0.7",

    # Rate limiting
    "slowapi==0.1.9",

    # Monitoring and logging
    "sentry-sdk[fastapi]==1.39.1",
    "python-json-logger==2.0.7",

    # Utilities
    "python-slugify==8.0.1",
    "pytz==2023.3",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "faker==20.1.0",

    # Code quality
    "black==23.12.0",
    "isort==5.13.2",
    "flake8==6.1.0",
    "mypy==1.7.1",
    "pylint==3.0.3",

    # Type stubs
    "types-redis==4.6.0.11",
    "types-python-jose==3.3.4.8",
    "types-passlib==1.7.7.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "faker>=20.1.0",
    "black>=23.12.0",
    "isort>=5.13.2",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "pylint>=3.0.3",
    "types-redis>=4.6.0.11",
    "types-python-jose>=3.3.4.8",
    "types-passlib>=1.7.7.13",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["app"]
skip = ["migrations"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "flower.*",
    "slowapi.*",
    "python_json_logger.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
]

[tool.pylint.format]
max-line-length = 100
